<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sổ tài chính">
<meta name="theme-color" content="#f5f3ee">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Sổ tài chính gia đình</title>
<style>
:root{
  --bg:#f5f3ee;--card:#fff;--card2:#f4f1ea;--tx:#1c1917;--mu:#8a8580;--bd:rgba(60,50,30,.12);
  --pri:#9a7419;--gold:#c9a24a;--grad:linear-gradient(135deg,#5c4410 0%,#9c7520 48%,#c9a24a 100%);
  --thu:#16a34a;--chi:#e5484d;--warn:#d97706;--glass:rgba(245,243,238,.97);--mu2:#57534e;--shadow:0 6px 24px rgba(60,45,10,.07);
  --kinh:rgba(252,250,245,.84);--kinhbd:rgba(255,255,255,.75);--sheetbg:rgba(245,243,238,.88);--tint:rgba(201,162,74,.12);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--tx:#f5f5f7;--mu:#98989f;--bd:rgba(84,84,88,.45);--pri:#d4af37;
  --glass:rgba(0,0,0,.94);--mu2:#d6d3d1;--shadow:none;--thu:#30d158;--chi:#ff453a;
  --kinh:rgba(36,36,38,.82);--kinhbd:rgba(255,255,255,.12);--sheetbg:rgba(28,28,30,.86);--tint:rgba(212,175,55,.16)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);
  font-size:16px;-webkit-font-smoothing:antialiased;padding-bottom:calc(112px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--tx)}
.hidden{display:none!important}
/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 22px) 18px 12px;background:var(--bg);
  transition:background .2s,box-shadow .2s;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.top.cuon{box-shadow:0 .5px 0 var(--bd),0 6px 16px rgba(0,0,0,.04)}
.top h1{font-size:30px;font-weight:800;letter-spacing:-.6px}
.top .sub{font-size:14px;color:var(--mu2);font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block;animation:pulse 1s infinite}
.mpill{display:flex;align-items:center;background:var(--card);border-radius:20px;box-shadow:var(--shadow);margin-bottom:4px}
.mpill button{width:34px;height:34px;font-size:20px;color:var(--pri)}
.mpill span{font-weight:700;font-size:14px;min-width:66px;text-align:center}
main{padding:6px 16px 0;max-width:600px;margin:0 auto}
/* ---------- Cards ---------- */
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 4px 8px}
.sec h2{font-size:20px;font-weight:800;letter-spacing:-.3px}
.sec button{color:var(--pri);font-weight:600;font-size:15px}
.hero{background:var(--grad);color:#fff;border-radius:24px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(156,117,32,.28)}
.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08);right:-60px;top:-80px}
.hero small{opacity:.85;font-size:13px;font-weight:600}
.hero .big{font-size:36px;font-weight:800;letter-spacing:-1px;margin:4px 0 14px}
.hero .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;position:relative;z-index:1}
.hero .row3 div{background:rgba(255,255,255,.14);border-radius:14px;padding:9px 10px}
.hero .row3 b{display:block;font-size:15px;margin-top:2px}
.hbar{height:6px;border-radius:4px;background:rgba(255,255,255,.25);margin:-4px 0 14px;overflow:hidden}
.hbar i{display:block;height:100%;background:#fff;border-radius:4px}
.voice{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border-radius:20px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);text-align:left}
.voice .orb{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(156,117,32,.35)}
.voice b{display:block;font-size:16px}.voice small{color:var(--mu);font-size:13px}
/* ---------- Wallet cards ---------- */
.wscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.wscroll::-webkit-scrollbar{display:none}
.wc{scroll-snap-align:start;flex:0 0 74%;max-width:300px;aspect-ratio:1.6;border-radius:20px;padding:16px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;text-align:left}
.wc.tindung{background:linear-gradient(135deg,#2a2a2c,#0c0c0d 55%,#3a3a3c);box-shadow:inset 0 0 0 .5px rgba(212,175,55,.35)}
.wc.tindung .t span{color:#d4af37;opacity:1}
.wc.tienmat{background:linear-gradient(135deg,#8a6a1f,#c9a24a 60%,#e6cf8b)}
.wc.nganhang{background:linear-gradient(135deg,#3f3524,#6b5a3a 60%,#8f7a52)}
.wc.vidientu{background:linear-gradient(135deg,#9d5c63,#c98b8f 60%,#e7b8b0)}
.wc.khac{background:linear-gradient(135deg,#475569,#64748b)}
.wc:after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07);right:-40px;bottom:-70px}
.wc .t{font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.wc .t span{font-size:12px;opacity:.75;font-weight:600}
.wc .v{font-size:24px;font-weight:800;letter-spacing:-.5px}
.wc .s{font-size:12px;opacity:.8}
.wc .lim{height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin-top:6px;overflow:hidden}
.wc .lim i{display:block;height:100%;background:#fbbf24}
/* ---------- Rows ---------- */
.list{background:var(--card);border-radius:20px;padding:2px 0;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:11px 16px;width:100%;text-align:left;position:relative}
.it+.it:before{content:"";position:absolute;top:0;left:66px;right:0;border-top:.5px solid var(--bd)}
.ic{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px}
.it .m{flex:1;min-width:0}
.it .m b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .m small{display:block;color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.it .a{font-weight:700;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.it .a small{display:block;font-weight:500;color:var(--mu);font-size:12px}
.chev{color:var(--mu);font-size:20px}
.thu{color:var(--thu)}.chi{color:var(--chi)}.mu{color:var(--mu)}
.dh{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--mu);margin:18px 6px 6px;text-transform:uppercase;letter-spacing:.2px}
.empty{text-align:center;color:var(--mu);padding:26px 16px;font-size:15px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:7px;background:var(--card2);color:var(--mu);margin-left:6px;font-weight:700;vertical-align:middle}
.tag.red{background:rgba(239,68,68,.14);color:var(--chi)}.tag.grn{background:rgba(22,163,74,.14);color:var(--thu)}
.bar{height:7px;background:var(--card2);border-radius:5px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:5px;background:var(--pri)}
.bar i.warn{background:var(--warn)}.bar i.over{background:var(--chi)}
/* donut + chart */
.donut{display:flex;align-items:center;gap:16px}
.donut svg{flex:0 0 132px}
.legend{flex:1;min-width:0}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px;padding:3px 0}
.legend i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.legend span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend b{font-variant-numeric:tabular-nums}
.chart{display:flex;align-items:flex-end;justify-content:space-between;height:120px;gap:6px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bars{display:flex;gap:3px;align-items:flex-end;height:100%}
.chart .bars i{width:9px;border-radius:4px 4px 2px 2px;display:block;min-height:2px}
.chart small{font-size:11px;color:var(--mu);font-weight:600}
.chart .on small{color:var(--tx)}
.leg2{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:8px}.leg2 i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
/* ---------- Tab bar ---------- */
nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:30;display:flex;justify-content:space-around;align-items:center;
  max-width:560px;margin:0 auto;padding:8px 6px;border-radius:32px;background:var(--kinh);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border:.5px solid var(--kinhbd);box-shadow:0 10px 30px rgba(40,30,10,.14),inset 0 1px 0 rgba(255,255,255,.5)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mu)}
nav button svg{width:25px;height:25px}
nav button.on{color:var(--pri)}
nav .fab{flex:0 0 70px}
nav .fab span{width:56px;height:56px;margin-top:-30px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(156,117,32,.4);border:3px solid rgba(255,255,255,.85)}
nav .fab svg{width:28px;height:28px;color:#fff}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ---------- Sheet ---------- */
#ov{position:fixed;inset:0;z-index:40;background:rgba(20,15,5,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
#ov.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:600px;margin:0 auto;background:var(--sheetbg);border-radius:30px 30px 0 0;
  -webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border-top:.5px solid var(--kinhbd);box-shadow:0 -10px 40px rgba(40,30,10,.18);
  max-height:calc(100% - env(safe-area-inset-top) - 18px);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.25,1);will-change:transform}
#sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(120,110,90,.35);margin:8px auto 0}
.keo{touch-action:none;padding-bottom:2px}
.shHead{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 12px;min-height:44px}
.shHead b{font-size:17px}
.shHead button{color:var(--pri);font-weight:600;font-size:16px;min-width:56px;text-align:left}
.shHead button:last-child{text-align:right}
#shBody{overflow:auto;padding:0 16px 10px;-webkit-overflow-scrolling:touch}
#shFoot{display:flex;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
#shFoot:empty{display:none}
.btn{flex:1;border-radius:14px;padding:15px;font-weight:700;font-size:16px;background:var(--card);color:var(--tx)}
.btn.pri{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(156,117,32,.3)}
.btn.del{background:rgba(239,68,68,.12);color:var(--chi);flex:0 0 auto;padding:15px 18px}
.btn.sm{flex:0 0 auto;padding:8px 14px;font-size:14px;border-radius:11px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
/* form */
.seg{display:flex;background:rgba(118,118,128,.16);border-radius:10px;padding:2px;margin-bottom:12px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-weight:600;font-size:14px}
.seg button.on{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.grp{background:var(--card);border-radius:14px;margin-bottom:14px;overflow:hidden}
.fl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;min-height:48px;position:relative}
.fl+.fl:before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--bd)}
.fl>span{font-size:16px;white-space:nowrap}
.fl input,.fl select{flex:1;min-width:0;border:0;background:none;text-align:right;font-size:16px;padding:12px 0;outline:none;-webkit-appearance:none;appearance:none;color:var(--tx)}
.fl select{direction:rtl}
.fl input[type=date]{text-align:right;min-height:24px}
.hint{font-size:12px;color:var(--mu);margin:-8px 16px 14px;line-height:1.45}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:4px 0 6px}
.amount input{width:2.2ch;max-width:86%;border:0;background:none;text-align:center;font-size:42px;font-weight:800;letter-spacing:-1px;outline:none;font-variant-numeric:tabular-nums}
.amount.chi input{color:var(--chi)}.amount.thu input{color:var(--thu)}
.amount span{font-size:24px;font-weight:700;color:var(--mu)}
.chu{text-align:center;font-size:15px;font-weight:600;color:var(--mu);margin:-2px 0 10px;min-height:20px}
.chu.co{color:var(--pri)}
.nhanh{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.nhanh button{background:var(--card);border-radius:12px;padding:8px 16px;font-weight:700;font-size:15px;box-shadow:var(--shadow)}
.lbl{font-size:13px;font-weight:700;color:var(--mu);margin:4px 4px 8px;text-transform:uppercase;letter-spacing:.2px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 4px;margin-bottom:14px}
.cat{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;border-radius:14px}
.cat .ic{width:48px;height:48px;border-radius:16px;font-size:24px;transition:transform .15s}
.cat small{font-size:11.5px;line-height:1.2;text-align:center;color:var(--tx);max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cat.on .ic{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--pri);transform:scale(1.04)}
.cat.on small{font-weight:700;color:var(--pri)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border-radius:20px;padding:9px 14px;font-weight:600;font-size:14px;border:1.5px solid transparent}
.chip.on{border-color:var(--pri);color:var(--pri);background:var(--tint)}
/* voice */
.vbox{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.mic{position:relative;width:60px;height:60px;flex:0 0 60px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(156,117,32,.35)}
.mic svg{width:28px;height:28px;color:#fff;position:relative;z-index:2}
.mic.rec{background:linear-gradient(135deg,#ef4444,#f97316)}
.mic.rec:before,.mic.rec:after{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(239,68,68,.35);animation:ring 1.4s infinite}
.mic.rec:after{animation-delay:.7s}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.8);opacity:0}}
@keyframes pulse{50%{opacity:.35}}
.vtxt{flex:1;min-width:0}
.vtxt b{display:block;font-size:16px;line-height:1.3;word-wrap:break-word}
.vtxt small{color:var(--mu);font-size:13px}
.qinput{display:flex;gap:8px;margin-bottom:14px}
.qinput input{flex:1;min-width:0;background:var(--card);border:0;border-radius:12px;padding:11px 12px;font-size:15px;outline:none}
/* toast */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-16px) scale(.96);opacity:0;visibility:hidden;z-index:60;background:rgba(30,30,32,.92);color:#fff;
  padding:11px 18px;border-radius:16px;font-size:14px;font-weight:600;transition:transform .3s cubic-bezier(.2,.9,.25,1.2),opacity .25s,visibility 0s .3s;max-width:90%;text-align:center;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .3s cubic-bezier(.2,.9,.25,1.2),opacity .2s}#toast.err{background:rgba(220,38,38,.95)}
/* setup */
.setup{padding:calc(env(safe-area-inset-top) + 40px) 22px 30px;max-width:460px;margin:0 auto}
.setup .logo{width:84px;height:84px;border-radius:22px;margin-bottom:16px;box-shadow:0 10px 30px rgba(156,117,32,.3)}
.setup h1{font-size:28px;font-weight:800;margin-bottom:8px}
.setup p{color:var(--mu);line-height:1.5;margin-bottom:18px;font-size:15px}
.setup textarea{width:100%;min-height:96px;border:0;border-radius:14px;padding:12px;background:var(--card);font:inherit;font-size:14px;margin-bottom:14px;color:var(--tx)}
.menu .it{padding:12px 16px}
.menu .ic{width:32px;height:32px;flex:0 0 32px;border-radius:9px;font-size:17px;color:#fff}
.note{font-size:13px;color:var(--mu);line-height:1.5;margin:0 6px 14px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;font-size:15px;position:relative}
.kv+.kv:before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--bd)}
.kv>span{color:var(--mu)}.kv b{text-align:right;font-weight:600}
.beta{font-size:11px;font-weight:800;letter-spacing:.5px;vertical-align:middle;padding:3px 7px;border-radius:7px;background:#f59e0b;color:#fff;position:relative;top:-4px}
.tgbox{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.tgbox .hd{display:flex;align-items:center;justify-content:space-between;font-weight:700}
.sw{width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.24);position:relative;transition:background .2s;flex:0 0 51px}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:#34c759}.sw.on:after{transform:translateX(20px)}
.tgbox .chips{margin:10px -14px 6px;padding:2px 14px}
.tgrow{display:flex;gap:8px;margin:6px 0}
.tgrow label{flex:1;font-size:12px;color:var(--mu);font-weight:600}
.tgrow input{display:block;width:100%;margin-top:4px;border:0;border-radius:10px;padding:10px;background:var(--card2);font-size:16px;color:var(--tx)}
.tgsum{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--tint);font-size:14px;line-height:1.55}
.tgsum b{color:var(--pri)}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.skel{height:90px;border-radius:20px;background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:14px}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>

<!-- Màn hình kết nối lần đầu -->
<div id="setup" class="setup hidden">
  <img class="logo" src="apple-touch-icon.png" alt="">
  <h1>Sổ tài chính gia đình</h1>
  <p>Kết nối với Google Sheet của anh/chị. Chỉ cần làm <b>một lần</b> trên mỗi thiết bị.</p>
  <div class="lbl">Địa chỉ API (Apps Script)</div>
  <textarea id="setupApi" style="min-height:64px" placeholder="https://script.google.com/macros/s/.../exec"></textarea>
  <div class="lbl">Mã bí mật</div>
  <textarea id="setupKey" style="min-height:64px" placeholder="Dán mã 64 ký tự từ Nhật ký thực thi (hàm taoMaBiMat)"></textarea>
  <button class="btn pri" style="width:100%" onclick="ketNoiTuLink()">Kết nối</button>
  <button class="btn" style="width:100%;margin-top:10px" onclick="batDemo()">🧪 Dùng dữ liệu thử (không đụng Google Sheet)</button>

// ---------- Hằng số ----------

const LOAI_VI = [['tindung','Thẻ tín dụng / Apple Pay'],['tienmat','Tiền mặt'],['nganhang','Tài khoản ngân hàng'],['vidientu','Ví điện tử'],['khac','Khác']];

// ---------- Trạng thái ----------
const S = {db:{}, url:'', thang:'', tab:'tq', loc:{loai:'', dt:'', q:''}, dmLoai:'chi'};
BANG.forEach(b => S.db[b] = []);
const CFG = {api:'', key:''};

// ---------- Tiện ích ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(+n || 0).toLocaleString('vi-VN');
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const homNay = () => ymd(new Date());
const congNgay = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const tong = (arr, f = x => x.soTien) => arr.reduce((s, x) => s + (+f(x) || 0), 0);
const ddmm = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '';
const ls = {get:k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set:(k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
  del:k => { try { localStorage.removeItem(k); } catch (e) {} }};
function fmtTat(n) {
  const a = Math.abs(n), d = n < 0 ? '−' : '';
  if (a >= 1e9) return d + (a / 1e9).toFixed(2).replace(/\.?0+$/, '').replace('.', ',') + ' tỷ';
  if (a >= 1e6) return d + (a / 1e6).toFixed(1).replace(/\.0$/, '').replace('.', ',') + ' tr';
  if (a >= 1e3) return d + Math.round(a / 1e3) + 'k';
  return d + fmt(a);
}
function nhanNgay(s) {
  const d = new Date(s + 'T00:00:00'), h = homNay();
  if (s === h) return 'Hôm nay'; if (s === congNgay(h, -1)) return 'Hôm qua';
  return ['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'][d.getDay()] + ', ' + s.slice(8, 10) + '/' + s.slice(5, 7);
}
function toast(m, loi) {
  const t = $('#toast'); t.textContent = m; t.className = 'show' + (loi ? ' err' : '');
  clearTimeout(t._h); t._h = setTimeout(() => t.className = '', loi ? 4000 : 1800);
}

// ---------- Kết nối API ----------
function docCauHinh() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('api')) ls.set(PF + 'api', h.get('api'));
  if (h.get('key')) ls.set(PF + 'key', h.get('key'));
  CFG.api = ls.get(PF + 'api') || ''; CFG.key = ls.get(PF + 'key') || '';
  if ($('#setupApi')) $('#setupApi').value = CFG.api;
  return !!(CFG.api && CFG.key);
}
function ketNoiTuLink() {
  const api = $('#setupApi').value.trim(), key = $('#setupKey').value.replace(/\s+/g, '');
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(api)) return toast('Địa chỉ API chưa đúng', 1);
  if (!/^[a-f0-9]{32,}$/i.test(key)) return toast('Mã bí mật chưa đúng', 1);
  ls.set(PF + 'api', api); ls.set(PF + 'key', key);
  history.replaceState(null, '', location.pathname + '#api=' + encodeURIComponent(api)); khoiDong();
}
async function goi(fn, ...args) {
  if (CFG.api === 'demo') return demoGoi(fn, args);
  const r = await fetch(CFG.api, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({key:CFG.key, fn, args})});
  if (!r.ok) throw new Error('Máy chủ lỗi ' + r.status);
  const j = await r.json();
  if (!j.ok) throw new Error(j.err || 'Lỗi không xác định');
  return j.data;
}

// ---------- Đọc số tiền tiếng Việt ----------
const DON_VI = {'tỷ':1e9,'tỉ':1e9,'triệu':1e6,'tr':1e6,'củ':1e6,'nghìn':1e3,'ngàn':1e3,'ng':1e3,'k':1e3,'ca':1e3,'vnđ':1,'vnd':1,'đồng':1,'đ':1};
function chuanChuoi(t) {
  let s = String(t || '').toLowerCase().normalize('NFC');
  for (let i = 0; i < 3; i++) s = s.replace(/(\d)\.(\d{3})(?!\d)/g, '$1$2');
  return s.replace(/(\d),(\d)/g, '$1.$2');
}
function timSoTien(s) {
  const re = /(\d+(?:\.\d+)?)\s*(tỷ|tỉ|triệu|tr|củ|nghìn|ngàn|ng|k|vnđ|vnd|đồng|đ)?(?![a-zà-ỹđ])/g;
  const tk = [...s.matchAll(re)].map(m => ({n:parseFloat(m[1]), raw:m[1], u:m[2] ? DON_VI[m[2]] : 0, i:m.index, j:m.index + m[0].length}));
  if (!tk.length) return null;
  let k = tk.findIndex(t => t.u > 0); if (k < 0) k = tk.length - 1;
  const t = tk[k], U = t.u || (t.n < 1000 ? 1000 : 1);
  let v = t.n * U, j = t.j;
  const ruoi = s.slice(j).match(/^\s*rưỡi/);
  if (ruoi) { v += 0.5 * U; j += ruoi[0].length; }
  else {
    const nx = tk[k + 1];
    if (nx && nx.i - j <= 2 && U > 1) {
      if (nx.u && nx.u < U) { v += nx.n * nx.u; j = nx.j; }
      else if (!nx.u && /^\d{1,3}$/.test(nx.raw)) { v += +nx.raw * U / Math.pow(10, nx.raw.length); j = nx.j; }
    }
  }
  return {v:Math.round(v), i:t.i, j};
}
// Ô số tiền: chỉ có chữ số → lấy đúng con số đã gõ; có chữ (45k, 1tr2) → hiểu theo cách nói tắt
const docSoTien = str => /^[\d.\s]*$/.test(String(str || '')) ? +String(str || '').replace(/\D/g, '') || 0 : (timSoTien(chuanChuoi(str)) || {}).v || 0;
function khopTuKhoa(sach, ten, tuKhoa) {
  let dai = 0;
  [ten, ...String(tuKhoa || '').split(',')].map(x => x.trim().toLowerCase()).filter(Boolean)
    .forEach(k => { if (sach.includes(' ' + k + ' ') && k.length > dai) dai = k.length; });
  return dai;
}
function phanTich(text) {
  const s = chuanChuoi(text), kq = {};
  const st = timSoTien(s);
  if (st) kq.soTien = st.v;
  let conLai = ' ' + (st ? s.slice(0, st.i) + ' ' + s.slice(st.j) : s) + ' ';
  if (/trả góp|góp \d+ (tháng|kỳ|kì)/.test(s)) {
    kq.traGop = {};
    const ky = s.match(/(\d+)\s*(tháng|kỳ|kì)/); if (ky) kq.traGop.soKy = +ky[1];
    const lai = s.match(/lãi(?:\s*suất)?\s*(\d+(?:\.\d+)?)\s*(%|phần trăm)/) || s.match(/(\d+(?:\.\d+)?)\s*(%|phần trăm)/);
    if (lai) kq.traGop.laiThang = +lai[1]; else if (/không lãi|lãi suất không|0 lãi/.test(s)) kq.traGop.laiThang = 0;
    conLai = conLai.replace(/(mua\s+)?trả góp/g, ' ').replace(/(lãi(\s*suất)?\s*)?\d+(\.\d+)?\s*(%|phần trăm)/g, ' ')
      .replace(/\d+\s*(tháng|kỳ|kì)/g, ' ').replace(/không lãi|lãi suất không/g, ' ');
  }
  const sach = ' ' + s.replace(/[.,;:!?()"]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
  let tot = null, dai = 0;
  dsDM().forEach(d => { const l = khopTuKhoa(sach, d.ten, d.tuKhoa); if (l > dai) { dai = l; tot = d; } });
  if (tot) { kq.danhMuc = tot.ten; kq.loai = tot.loai; }
  let vi = null; dai = 0;
  dsVi().forEach(v => { const l = khopTuKhoa(sach, v.ten, v.tuKhoa); if (l > dai) { dai = l; vi = v; } });
  if (vi) {
    kq.vi = vi.ten;
    // bỏ cụm "bằng/qua apple pay", "tiền mặt"... khỏi ghi chú
    [vi.ten, ...String(vi.tuKhoa || '').split(',')].map(x => x.trim().toLowerCase()).filter(Boolean).sort((a, b) => b.length - a.length)
      .forEach(k => { conLai = conLai.replace(new RegExp('(?:\\s(?:bằng|qua|trả bằng|thanh toán bằng|dùng))?\\s' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=\\s|$)', 'g'), ' '); });
  }
  dsDoiTuong().forEach(t => { if (t !== 'Chung' && sach.includes(' ' + t.toLowerCase() + ' ')) kq.doiTuong = t; });
  if (/\b(hôm qua)\b/.test(sach)) kq.ngay = congNgay(homNay(), -1);
  const gc = (' ' + conLai + ' ').replace(/\s(hôm nay|hôm qua)\s/g, ' ').replace(/\s+/g, ' ').trim();
  kq.ghiChu = gc ? gc[0].toUpperCase() + gc.slice(1) : '';
  return kq;
}

// ---------- Truy vấn dữ liệu ----------
const dsVi = caAn => S.db.Vi.filter(v => caAn || !v.an).sort((a, b) => a.thuTu - b.thuTu);
const dsDM = (loai, caAn) => S.db.DanhMuc.filter(d => (!loai || d.loai === loai) && (caAn || !d.an)).sort((a, b) => a.thuTu - b.thuTu);
const dsDoiTuong = () => String((S.db.CaiDat.find(c => c.khoa === 'doiTuong') || {}).giaTri || 'Chung').split(',').map(x => x.trim()).filter(Boolean);
const viTheoTen = t => S.db.Vi.find(v => v.ten === t);
function viMacDinh() {
  const cu = ls.get(PF + 'viCuoi'); if (cu && dsVi().some(v => v.ten === cu)) return cu;
  return (dsVi().find(v => v.loai === 'tindung') || dsVi()[0] || {}).ten || '';
}
function iconDM(ten) { const d = S.db.DanhMuc.find(x => x.ten === ten); return (d && d.icon) || ICON_DM[ten] || (d && d.loai === 'thu' ? '💰' : '📦'); }
function mauDM(ten) { const i = dsDM(null, true).findIndex(x => x.ten === ten); return MAU[(i < 0 ? 12 : i) % MAU.length]; }
const gdThang = (t = S.thang) => S.db.GiaoDich.filter(g => String(g.ngay).startsWith(t));
function soDuVi(ten) {
  const v = viTheoTen(ten); let s = v ? +v.soDuDau || 0 : 0;
  S.db.GiaoDich.forEach(g => {
    if (g.vi === ten) s += (g.loai === 'thu' || g.loai === 'vao') ? g.soTien : -g.soTien;
    if (g.loai === 'chuyen' && g.viDen === ten) s += g.soTien;
  });
  return s;
}
function hanThe(v) {            // ngày đến hạn thanh toán gần nhất của thẻ
  if (!v.ngayTT) return '';
  const d = new Date(), n = +v.ngayTT;
  let y = d.getFullYear(), m = d.getMonth();
  if (d.getDate() > n) m++;
  const cuoi = new Date(y, m + 1, 0).getDate();
  return ymd(new Date(y, m, Math.min(n, cuoi)));
}
const soNgayToi = s => Math.round((new Date(s + 'T00:00:00') - new Date(homNay() + 'T00:00:00')) / 864e5);
function trangThaiVay(v) {
  const daTra = tong(S.db.GiaoDich.filter(g => g.lienKet === v.id && g.loai === (v.loai === 'vay' ? 'ra' : 'vao')));
  return {daTra, conLai: v.trangThai === 'xong' ? 0 : Math.max(0, v.soTien - daTra)};
}
function laiDuKien(t) {
  if (t.nhom !== 'tietkiem' || !t.laiSuat || !t.ngayMua) return 0;
  const den = t.ngayDaoHan && t.ngayDaoHan < homNay() ? t.ngayDaoHan : homNay();
  return Math.max(0, t.giaVon * t.laiSuat / 100 * ((new Date(den) - new Date(t.ngayMua)) / 864e5) / 365);
}
function giaTriTS(t) {
  if (t.trangThai === 'daban') return 0;
  if (t.nhom === 'tietkiem') return t.giaVon + laiDuKien(t);
  if ((t.nhom === 'vang' || t.nhom === 'chungkhoan') && t.donGiaHT > 0 && t.soLuong > 0) return t.soLuong * t.donGiaHT;
  return t.giaTriHT || t.giaVon;
}
function taiSanRong() {
  let tien = 0, noThe = 0;
  dsVi(true).forEach(v => { const s = soDuVi(v.ten); if (v.loai === 'tindung') noThe += -s + gocTGChoThe(v.ten); else tien += s; });
  const ts = tong(S.db.TaiSan, giaTriTS);
  let choVay = 0, noVay = 0;
  S.db.VayNo.forEach(v => { const c = trangThaiVay(v).conLai; if (v.loai === 'vay') noVay += c; else choVay += c; });
  return {tien, noThe, ts, choVay, noVay, rong: tien - noThe + ts + choVay - noVay};
}
function canChuY() {
  const out = [], t = homNay().slice(0, 7), d = +homNay().slice(8);
  S.db.DinhKy.filter(k => !k.an && k.lanCuoi !== t && (+k.ngayTrongThang || 1) <= d + 3).forEach(k => out.push({k:'dk', o:k}));

// Bảng nhập bám theo bàn phím: luôn thấy nút Lưu, không bị đẩy khỏi màn hình
function banPhim() {

document.addEventListener('focusout', () => setTimeout(() => {

// Vuốt xuống để đóng (giống iPhone): kéo ở thanh trên, hoặc kéo nội dung khi đã cuộn lên đầu
(function () {
  let y0 = null, dy = 0, t0 = 0, keo = false, tuDau = false;
  const sh = () => $('#sheet'), body = () => $('#shBody');
  document.addEventListener('touchstart', e => {
    const s = sh(); if (!s.classList.contains('open') || !s.contains(e.target)) return;
    if (e.target.closest('input,textarea,select,.chips,.wscroll,.amount')) { y0 = null; return; }
    tuDau = !!e.target.closest('.keo'); if (!tuDau && body().scrollTop > 0) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0; t0 = Date.now(); keo = false;
  }, {passive:true});
  document.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (!keo && dy < 0) { y0 = null; return; }
    if (!keo && dy > 6 && (tuDau || body().scrollTop <= 0)) keo = true;
    if (keo) { const s = sh(); s.style.transition = 'none'; s.style.transform = 'translateY(' + Math.max(0, dy) + 'px)';
      $('#ov').style.opacity = String(Math.max(0, 1 - dy / 500)); if (e.cancelable) e.preventDefault(); }
  }, {passive:false});
  document.addEventListener('touchend', () => {
    if (y0 === null) return;
    const s = sh(), v = dy / Math.max(1, Date.now() - t0);
    if (keo && (dy > 110 || v > 0.55)) dongSheet();
    else if (keo) { s.style.transition = ''; s.style.transform = ''; $('#ov').style.opacity = ''; }
    y0 = null; keo = false;
  });
})();

// Định dạng dấu phân cách hàng nghìn ngay khi gõ, giữ đúng vị trí con trỏ
function goSo(el) {
  const v = el.value;
  if (/[^\d.\s]/.test(v)) return;                       // có chữ (45k, 1tr2) → định dạng khi rời ô
  const pos = el.selectionStart == null ? v.length : el.selectionStart;
  const soTruoc = v.slice(0, pos).replace(/\D/g, '').length;
  const d = v.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 13);
  const f = d ? Number(d).toLocaleString('vi-VN') : '';
  if (f === v) return;
  el.value = f;
  let i = 0, c = 0;
  while (i < f.length && c < soTruoc) { if (/\d/.test(f[i])) c++; i++; }
  try { el.setSelectionRange(i, i); } catch (e) {}
}
// Đọc số bằng chữ ngắn gọn: 1250000 → "1 triệu 250 nghìn đồng"
function docChu(n) {
  n = Math.round(+n || 0); if (!n) return '';
  const ty = Math.floor(n / 1e9), tr = Math.floor(n % 1e9 / 1e6), ng = Math.floor(n % 1e6 / 1e3), d = n % 1e3, p = [];
  if (ty) p.push(ty.toLocaleString('vi-VN') + ' tỷ'); if (tr) p.push(tr + ' triệu'); if (ng) p.push(ng + ' nghìn'); if (d) p.push(d);
  return p.join(' ') + ' đồng';
}
function docChuGD() { const el = $('#g_chu'), n = docSoTien($('#g_soTien').value); if (el) { el.textContent = n ? docChu(n) : 'Nhập số tiền'; el.classList.toggle('co', !!n); } }
function themSo(z) { const el = $('#g_soTien'), d = el.value.replace(/\D/g, ''); el.value = d ? d + z : ''; goSo(el); coGian(el); docChuGD(); }
function xoaSo() { const el = $('#g_soTien'); el.value = ''; coGian(el); docChuGD(); el.focus(); }
function coGian(el) { if (el) el.style.width = Math.max(1, (el.value || '0').length) * 0.57 + 0.5 + 'em'; }
function docGD() {
  const v = id => $(id) ? $(id).value.trim() : null;
  G.soTien = docSoTien(v('#g_soTien')); G.ngay = v('#g_ngay') || homNay(); G.ghiChu = v('#g_ghiChu') || '';
}
function doiLoaiGD(l) {
  docGD();
  if (l === 'thu' || l === 'chi') { const d = S.db.DanhMuc.find(x => x.ten === G.danhMuc); if (!d || d.loai !== l) G.danhMuc = ''; }
  if (l === 'chuyen' && !G.viDen) { const the = dsVi().find(v => v.loai === 'tindung' && v.ten !== G.vi); if (the) { G.viDen = the.ten; G.vi = (dsVi().find(v => v.loai === 'nganhang') || {}).ten || G.vi; } }
  G.loai = l; veFormGD();
}
function chonDM(el) { G.danhMuc = el.dataset.v; document.querySelectorAll('#gdForm .cat').forEach(c => c.classList.toggle('on', c === el)); }
function chonChip(el) {
  G[el.dataset.f] = el.dataset.v; el.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el));
  if (el.dataset.f === 'vi' && Gmoi && G.loai === 'chi') { docGD(); veFormGD(); }   // hiện / ẩn khối trả góp theo loại ví
}
function apDung(text) {
  docGD();
  const k = phanTich(text);
  if (k.soTien) G.soTien = k.soTien;
  if (k.danhMuc) { G.danhMuc = k.danhMuc; G.loai = k.loai; }
  if (k.vi) G.vi = k.vi;
  if (k.doiTuong) G.doiTuong = k.doiTuong;
  if (k.ngay) G.ngay = k.ngay;
  if (k.traGop) {
    const the = (viTheoTen(G.vi) || {}).loai === 'tindung' ? G.vi : (dsVi().find(v => v.loai === 'tindung') || {}).ten;
    if (the) { G.vi = the; G.loai = 'chi'; G.tg = {...macDinhTG(), ...(G.tg || {}), bat:true, ...k.traGop}; }
  }
  G.ghiChu = k.ghiChu;
  veFormGD('“' + text + '”');
  const sub = $('#vSub');
  if (sub) sub.innerHTML = !k.soTien ? '<span class="chi">Chưa nghe rõ số tiền – nói lại hoặc nhập tay</span>'
    : !k.danhMuc ? '<span style="color:var(--warn)">Chọn danh mục bên dưới rồi bấm Lưu</span>' : '<span class="thu">✓ Đã điền – kiểm tra rồi bấm Lưu</span>';
}
let REC = null, recTxt = '', recDaApDung = false, recLuc = 0, recCo = false;
// Gộp kết quả: Safari iOS đôi khi trả kết quả tích lũy (câu sau chứa câu trước) → tránh lặp chữ
function gopKQ(results) {
  const arr = [...results].map(x => x[0].transcript.trim()).filter(Boolean);
  const dai = arr.reduce((a, b) => b.length > a.length ? b : a, '');
  return arr.every(x => dai.toLowerCase().includes(x.toLowerCase())) ? dai : arr.join(' ');
}
function nghe() {
  if (REC) { try { REC.stop(); } catch (e) {} return; }                  // chạm lần 2 = dừng & điền
  if (Date.now() - recLuc < 700) return;                                // chống chạm đúp
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return goiYDuPhong('Trình duyệt này chưa hỗ trợ nhận giọng nói – hãy gõ hoặc dùng micro trên bàn phím ở ô bên dưới.');
  let r;
  try { r = new SR(); } catch (e) { return goiYDuPhong('Không khởi động được micro.'); }
  r.lang = 'vi-VN'; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
  recTxt = ''; recDaApDung = false; recCo = false; recLuc = Date.now();
  const datIm = ms => { clearTimeout(r._im); r._im = setTimeout(() => { try { r.stop(); } catch (e) {} }, ms); };
  r.onstart = () => { const b = $('#micBtn'); if (b) b.classList.add('rec'); const t = $('#vTxt'); if (t) t.textContent = 'Đang nghe… nói đi ạ'; datIm(7000); };
  r.onresult = e => {
    recCo = true; recTxt = gopKQ(e.results);
    const el = $('#vTxt'); if (el) el.textContent = recTxt;
    datIm(1400);                                                         // im lặng 1,4 giây → tự dừng
    if (e.results[e.results.length - 1].isFinal && !recDaApDung) { recDaApDung = true; apDung(recTxt); }
  };
  r.onerror = e => {
    if (e.error === 'aborted') return;
    const m = {'not-allowed':'Chưa cho phép micro: Cài đặt › Safari › Micro › Cho phép (hoặc chạm “aA” trên thanh địa chỉ › Cài đặt trang web).',
      'service-not-allowed':'Hãy bật Đọc chính tả: Cài đặt › Cài đặt chung › Bàn phím › Bật Đọc chính tả.',
      'no-speech':'Chưa nghe thấy – chạm micro rồi nói ngay, hoặc gõ ở ô bên dưới.', 'audio-capture':'Micro đang bận (cuộc gọi/ghi âm khác?).',
      'network':'Cần kết nối mạng để nhận giọng nói.'}[e.error];
    goiYDuPhong(m || 'Lỗi nhận giọng nói (' + e.error + ').');
  };
  r.onend = () => {
    clearTimeout(r._im); REC = null;
    const b = $('#micBtn'); if (b) b.classList.remove('rec');
    if (recTxt && !recDaApDung) { recDaApDung = true; apDung(recTxt); }
    else if (!recCo) { const t = $('#vTxt'); if (t && /Đang nghe/.test(t.textContent)) t.textContent = 'Chạm micro và nói'; }
  };
  REC = r;
  try { r.start(); } catch (e) { REC = null; goiYDuPhong('Không khởi động được micro, thử lại sau giây lát.'); }
}
function goiYDuPhong(m) {

  else toast(m, 1);

const macDinhTG = () => ({bat:false, soKy:6, laiThang:0, phiCD:0, cachGhi:'theoky', dangTra:false, daTra:0});
function kyTG(t, k) {                       // ngày đến hạn kỳ k: theo ngày đến hạn thẻ (nếu có), không thì theo ngày mua
  const d = new Date(t.ngayMua + 'T00:00:00'), v = viTheoTen(t.vi), ngay = v && v.ngayTT ? +v.ngayTT : d.getDate();
  const y = d.getFullYear(), m = d.getMonth() + k, cuoi = new Date(y, m + 1, 0).getDate();
  return ymd(new Date(y, m, Math.min(ngay, cuoi)));
}
function tinhTG(t) {
  const n = Math.max(1, Math.round(t.soKy) || 1), goc = +t.soTien || 0, daGhi = Math.min(n, t.daGhi || 0);
  const gocKy = Math.floor(goc / n), laiKy = Math.round(goc * (+t.laiThang || 0) / 100), phi = Math.round(goc * (+t.phiCD || 0) / 100);
  const xong = t.trangThai === 'xong';
  const gocDaTra = daGhi >= n ? goc : daGhi * gocKy;
  return {n, gocKy, laiKy, phi, moiKy: gocKy + laiKy, tongLai: laiKy * n, tongTra: goc + laiKy * n + phi,
    gocConLai: xong ? 0 : goc - gocDaTra, kyTiep: !xong && daGhi < n ? kyTG(t, daGhi + 1) : ''};
}
// Gốc trả góp chưa vào sao kê (chỉ kiểu "chia theo tháng"; kiểu "ghi ngay" đã nằm trong dư nợ thẻ)
const gocTGChoThe = ten => tong(S.db.TraGop.filter(t => t.vi === ten && t.cachGhi !== 'ngay'), t => tinhTG(t).gocConLai);
function dmLai() { return (S.db.DanhMuc.find(d => d.ten === 'Lãi vay & phí') || dsDM('chi').find(d => /phí|lãi/i.test(d.ten)) || dsDM('chi')[0] || {}).ten || ''; }
function khoiTG() {
  const t = G.tg || (G.tg = macDinhTG());
  let h = `<div class="tgbox"><div class="hd"><span>🧾 Mua trả góp qua thẻ</span><button class="sw ${t.bat ? 'on' : ''}" onclick="batTG()" aria-label="Bật trả góp"></button></div>`;
  if (t.bat) {
    h += `<div class="seg" style="margin:10px 0 0"><button class="${!t.dangTra ? 'on' : ''}" onclick="docTG();G.tg.dangTra=false;veFormGD()">Mua mới</button>
      <button class="${t.dangTra ? 'on' : ''}" onclick="docTG();G.tg.dangTra=true;G.tg.cachGhi='theoky';veFormGD()">Đang trả dở</button></div>`;
    if (t.dangTra) h += `<p class="note" style="margin:8px 0 0">Nhập <b>giá gốc</b> món hàng ở ô số tiền, <b>ngày mua ban đầu</b> ở ô Ngày bên dưới, và số kỳ đã trả. App chỉ theo dõi các kỳ còn lại, không ghi lại các kỳ đã qua.</p>`;
    h += `<div class="chips">${[3, 6, 9, 12, 18, 24, 36].map(k => `<button class="chip ${t.soKy === k ? 'on' : ''}" onclick="docTG();G.tg.soKy=${k};veFormGD()">${k} tháng</button>`).join('')}</div>
      <div class="tgrow"><label>Lãi %/tháng (0 nếu 0%)<input id="tg_lai" inputmode="decimal" value="${t.laiThang || ''}" placeholder="0" oninput="docTG();tomTatTG()"></label>
      ${t.dangTra ? `<label>Đã trả (số kỳ)<input id="tg_daTra" inputmode="numeric" value="${t.daTra || ''}" placeholder="0" oninput="docTG();tomTatTG()"></label>`
        : `<label>Phí chuyển đổi % (1 lần)<input id="tg_phi" inputmode="decimal" value="${t.phiCD || ''}" placeholder="0" oninput="docTG();tomTatTG()"></label>`}</div>
      ${t.dangTra ? '' : `<div class="seg" style="margin:8px 0 0"><button class="${t.cachGhi !== 'ngay' ? 'on' : ''}" onclick="docTG();G.tg.cachGhi='theoky';veFormGD()">Chi phí chia theo tháng</button>
      <button class="${t.cachGhi === 'ngay' ? 'on' : ''}" onclick="docTG();G.tg.cachGhi='ngay';veFormGD()">Ghi toàn bộ ngay</button></div>`}
      <div class="tgsum" id="tg_sum"></div>`;
  }
  return h + '</div>';
}
function batTG() { docGD(); docTG(); G.tg.bat = !G.tg.bat; veFormGD(); }
function docTG() {
  if (!G.tg) G.tg = macDinhTG();
  const n = id => { const el = $(id); return el ? Math.max(0, +String(el.value).replace(',', '.') || 0) : null; };
  const l = n('#tg_lai'), p = n('#tg_phi'), d = n('#tg_daTra'); if (l !== null) G.tg.laiThang = l; if (p !== null) G.tg.phiCD = p;
  if (d !== null) G.tg.daTra = Math.round(d);
  const ng = $('#g_ngay'); if (ng && ng.value) G.ngay = ng.value;
  const st = $('#g_soTien'); if (st) G.soTien = docSoTien(st.value);
}
function tomTatTG() {
  const el = $('#tg_sum'); if (!el || !G.tg || !G.tg.bat) return;
  const goc = docSoTien(($('#g_soTien') || {}).value) || G.soTien;
  if (!goc) { el.innerHTML = 'Nhập giá món hàng ở ô số tiền phía trên.'; return; }
  const ngay = ($('#g_ngay') || {}).value || G.ngay || homNay();

      <span class="mu">Không ghi lại các kỳ đã trả. Mỗi kỳ còn lại sẽ được nhắc và ghi thành khoản chi trên thẻ.</span>`;

  }
  const c = tinhTG({soTien:goc, soKy:G.tg.soKy, laiThang:G.tg.laiThang, phiCD:G.tg.phiCD, daGhi:0, ngayMua:ngay, vi:G.vi});
  el.innerHTML = `Mỗi tháng trả <b>${fmt(c.moiKy)} đ</b> × ${c.n} kỳ (kỳ đầu ${ddmm(c.kyTiep)})<br>
    Tổng lãi ${fmt(c.tongLai)} đ · phí ${fmt(c.phi)} đ · <b>tổng phải trả ${fmt(c.tongTra)} đ</b><br>
    <span class="mu">${G.tg.cachGhi === 'ngay' ? 'Ghi chi tiêu toàn bộ giá trị ngay hôm nay; hằng tháng chỉ ghi thêm tiền lãi (nếu có).' : 'Mỗi tháng ghi một khoản chi bằng tiền gốc kỳ đó (+ lãi), đúng như số tiền trên sao kê.'}</span>`;
}
function taoTG(r, tiep) {
  const t = G.tg, id = uid(), ts = new Date().toISOString();

  if (t.dangTra && daTra >= t.soKy) return toast('Số kỳ đã trả bằng tổng số kỳ – khoản này đã xong', 1);
  const tg = {id, ten:r.ghiChu || r.danhMuc, vi:r.vi, ngayMua:r.ngay, soTien:r.soTien, soKy:t.soKy, laiThang:t.laiThang || 0, phiCD:t.dangTra ? 0 : t.phiCD || 0,
    cachGhi:t.dangTra ? 'theoky' : t.cachGhi, danhMuc:r.danhMuc, doiTuong:r.doiTuong || 'Chung', daGhi:daTra, trangThai:'', ghiChu:t.dangTra ? 'Nhập khi đã trả ' + daTra + ' kỳ' : ''};
  const c = tinhTG(tg), ds = [{bang:'TraGop', r:tg}];

    ghi(ds); toast('Đã thêm khoản trả góp đang trả · còn ' + (c.n - daTra) + ' kỳ');
    if (tiep) moGD(null, {ngay:homNay(), vi:r.vi}); else dongSheet();
    return;
  }
  if (t.cachGhi === 'ngay') ds.push({bang:'GiaoDich', r:{...r, lienKet:id, ghiChu:(r.ghiChu || r.danhMuc) + ' (trả góp ' + c.n + ' tháng)'}});
  if (c.phi > 0) ds.push({bang:'GiaoDich', r:{id:uid(), ngay:r.ngay, loai:'chi', soTien:c.phi, danhMuc:dmLai(), vi:r.vi, viDen:'', doiTuong:tg.doiTuong, lienKet:id,
    ghiChu:'Phí chuyển đổi trả góp: ' + tg.ten, taoLuc:ts}});
  ghi(ds);
  toast('Đã tạo trả góp ' + c.n + ' tháng · mỗi kỳ ' + fmtTat(c.moiKy));
  if (tiep) moGD(null, {ngay:r.ngay, vi:r.vi}); else dongSheet();

function ghiKyTG(id) {
  const t = S.db.TraGop.find(x => x.id === id); if (!t) return;
  const c = tinhTG(t), k = (t.daGhi || 0) + 1; if (k > c.n || t.trangThai === 'xong') return;
  const ngay = kyTG(t, k), ts = new Date().toISOString(), ds = [];
  const goc = k === c.n ? t.soTien - c.gocKy * (c.n - 1) : c.gocKy;
  if (t.cachGhi !== 'ngay') ds.push({bang:'GiaoDich', r:{id:uid(), ngay, loai:'chi', soTien:goc, danhMuc:t.danhMuc, vi:t.vi, viDen:'', doiTuong:t.doiTuong, lienKet:id,
    ghiChu:`Trả góp ${t.ten} – kỳ ${k}/${c.n}`, taoLuc:ts}});
  if (c.laiKy > 0) ds.push({bang:'GiaoDich', r:{id:uid(), ngay, loai:'chi', soTien:c.laiKy, danhMuc:dmLai(), vi:t.vi, viDen:'', doiTuong:t.doiTuong, lienKet:id,
    ghiChu:`Lãi trả góp ${t.ten} – kỳ ${k}/${c.n}`, taoLuc:ts}});
  ds.push({bang:'TraGop', r:{...t, daGhi:k, trangThai:k >= c.n ? 'xong' : ''}});
  ghi(ds); toast(`Đã ghi kỳ ${k}/${c.n}` + (k >= c.n ? ' – hoàn tất trả góp 🎉' : ''));
  if ($('#sheet').classList.contains('open') && $('#shTitle').textContent === t.ten) moTG(id);
}
function dongTG(t) {
  const c = tinhTG(t), xong = t.trangThai === 'xong', p = (t.daGhi || 0) / c.n * 100;
  return `<button class="it" onclick="moTG('${esc(t.id)}')"><span class="ic" style="background:#f43f5e22">🧾</span><span class="m"><b>${esc(t.ten)}${xong ? '<span class="tag grn">Xong</span>' : ''}</b>
    <small>Kỳ ${t.daGhi || 0}/${c.n} · ${fmtTat(c.moiKy)}/tháng${+t.laiThang ? ' · lãi ' + t.laiThang + '%' : ' · 0%'}${c.kyTiep ? ' · kỳ tới ' + c.kyTiep.slice(8) + '/' + c.kyTiep.slice(5, 7) : ''}</small>
    ${xong ? '' : `<div class="bar"><i style="width:${p}%"></i></div>`}</span><span class="a">${xong ? '' : fmt(c.gocConLai)}<small>${xong ? '' : 'gốc còn'}</small></span></button>`;
}
function vTraGop() {
  const dang = S.db.TraGop.filter(t => t.trangThai !== 'xong'), xong = S.db.TraGop.filter(t => t.trangThai === 'xong');
  const the = dsVi().find(v => v.loai === 'tindung');

    <small>${dang.length} khoản đang trả · mỗi tháng ≈ ${fmtTat(tong(dang, t => tinhTG(t).moiKy))}</small></div>

    <button class="btn" onclick="moGD(null,{loai:'chi',vi:'${esc(the ? the.ten : '')}',tg:{...macDinhTG(),bat:true,dangTra:true}})">+ Khoản đang trả dở</button></div>`;
  h += `<div class="list">${dang.length ? dang.map(dongTG).join('') : '<div class="empty">Chưa có khoản trả góp</div>'}</div>`;
  if (xong.length) h += `<div class="dh"><span>Đã hoàn tất</span></div><div class="list">${xong.map(dongTG).join('')}</div>`;
  return h + `<p class="note"><b>Chia theo tháng</b> (khuyên dùng): mỗi kỳ ghi một khoản chi đúng số tiền trên sao kê, ngân sách tháng phản ánh đúng.
    <b>Ghi toàn bộ ngay</b>: tính hết giá trị món hàng vào tháng mua. Lãi và phí luôn ghi vào danh mục “Lãi vay & phí”. Nói nhanh: “mua tủ lạnh 12 triệu trả góp 6 tháng apple pay”.</p>`;
}
function moTG(id) {
  const t = S.db.TraGop.find(x => x.id === id); if (!t) return dongSheet();
  const c = tinhTG(t), xong = t.trangThai === 'xong';
  let h = `<div class="grp">${kv('Thẻ', esc(t.vi))}${kv('Ngày mua', ddmm(t.ngayMua))}${kv('Giá món hàng', fmt(t.soTien))}${kv('Số kỳ', c.n + ' tháng')}
    ${kv('Lãi', +t.laiThang ? t.laiThang + '%/tháng · ' + fmt(c.laiKy) + '/kỳ' : '0%')}${kv('Phí chuyển đổi', c.phi ? fmt(c.phi) + ' (' + t.phiCD + '%)' : '0')}
    ${kv('Mỗi kỳ trả', '<b>' + fmt(c.moiKy) + '</b>')}${kv('Tổng phải trả', fmt(c.tongTra))}${kv('Đã ghi', (t.daGhi || 0) + '/' + c.n + ' kỳ')}
    ${kv('Gốc còn lại', fmt(c.gocConLai))}${c.kyTiep ? kv('Kỳ tiếp theo', ddmm(c.kyTiep)) : ''}${kv('Cách ghi chi phí', t.cachGhi === 'ngay' ? 'Ghi toàn bộ ngay' : 'Chia theo tháng')}</div>`;
  const lk = sapXepGD(S.db.GiaoDich.filter(g => g.lienKet === id));
  if (lk.length) h += `<div class="lbl">Đã ghi</div><div class="list">${lk.map(dongGD).join('')}</div>`;
  const nut = [{t:'Xóa', c:'del', xoa:true, fn:() => { ghi([{bang:'TraGop', r:{id}, xoa:true}, ...lk.map(g => ({bang:'GiaoDich', r:{id:g.id}, xoa:true}))]); dongSheet(); toast('Đã xóa khoản trả góp'); }}];
  if (!xong) nut.push({t:'Tất toán sớm', fn:() => tatToanTG(id)}, {t:'Ghi kỳ ' + ((t.daGhi || 0) + 1), c:'pri', fn:() => ghiKyTG(id)});

function tatToanTG(id) {
  const t = S.db.TraGop.find(x => x.id === id), c = tinhTG(t);
  moForm('Tất toán trước hạn', [{k:'phi', l:'Phí tất toán (nếu có)', t:'money'}, {k:'ngay', l:'Ngày', t:'date'}], {phi:0, ngay:homNay()}, o => {
    const ts = new Date().toISOString(), ds = [];

  }, [], t.cachGhi !== 'ngay' ? `Gốc còn lại ${fmt(c.gocConLai)} đ sẽ được ghi thành một khoản chi trên thẻ.` : 'Giá trị món hàng đã được ghi từ ngày mua; chỉ ghi thêm phí (nếu có).');
}

function demoDb() { try { return JSON.parse(ls.get(PF + 'demo') || 'null') || {}; } catch (e) { return {}; } }
function demoGoi(fn, args) {
  const db = demoDb(); BANG.forEach(b => db[b] = db[b] || []);
  const xong = v => new Promise(r => setTimeout(() => r(v), 250));
  if (fn === 'layDuLieu') return xong({...db, url:''});
  if (fn === 'luu') {
    args[0].forEach(c => { const arr = db[c.bang], key = c.bang === 'CaiDat' ? 'khoa' : 'id', i = arr.findIndex(x => x[key] === c.r[key]);
      if (c.xoa) { if (i >= 0) arr.splice(i, 1); } else if (i >= 0) arr[i] = {...c.r}; else arr.push({...c.r}); });
    ls.set(PF + 'demo', JSON.stringify(db)); return xong(true);
  }
  if (fn === 'doiTen') {
    const [loai, cu, moi] = args, cot = loai === 'vi' ? ['vi', 'viDen'] : ['danhMuc'];

    ['Y tế', 180000, 'Thuốc', 'tienmat'], ['Giải trí & du lịch', 900000, 'Nhà hàng', 'tindung'], ['Học tập', 2500000, 'Học phí', 'nganhang']];
